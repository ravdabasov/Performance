<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Performance Management Dashboard</title>
<meta name="description" content="Offline Enterprise Performance Management Dashboard — Sales, Bonus, KPI and Forecast Business Intelligence Platform">

<!--
  ============================================================================
  ENTERPRISE PERFORMANCE MANAGEMENT DASHBOARD
  ============================================================================
  Delivery model : single offline HTML file (no build step, no server).
  Stack          : HTML5, CSS3, Vanilla JavaScript (ES2022) only.
  Storage        : IndexedDB (business data) + LocalStorage (UI preferences).

  DEVELOPMENT STATUS
  -------------------
  This file is being delivered in incremental, fully-functional phases per
  the agreed roadmap. Each phase below is either COMPLETE or SCHEDULED —
  nothing in a COMPLETE phase is a stub, mock, or placeholder.

    Phase 1  Foundation (Config / Theme / Language / Auth / Authorization) : COMPLETE
    Phase 2  Data Layer (IndexedDB / Import / Validation / Normalization)  : scheduled
    Phase 3  Business Layer (Formula / Business Rules / Filters)          : scheduled
    Phase 4  Presentation Layer (Dashboard / Charts / Tables)             : scheduled
    Phase 5  Business Modules (Sales / Bonus / Forecast / Comparison...)  : scheduled
    Phase 6  Advanced Features (AI Insights / Export / Backup / Config)   : scheduled
    Phase 7  Optimization (Performance / Accessibility / Error handling)  : scheduled
    Phase 8  Quality Assurance                                           : scheduled

  DISCLOSED ARCHITECTURE DECISIONS
  ---------------------------------
  1. No <script type="module">: opening this file directly via file://
     blocks ES module loading under CORS in most browsers. All engines
     below are plain scripts namespaced under a single `App` object to
     keep true double-click offline compatibility.
  2. Icon system: the spec calls for both "Font Awesome" and "zero external
     runtime resources / single file". Rather than inline a multi-hundred-KB
     base64 webfont for a handful of glyphs, this build uses a small,
     self-authored inline SVG icon set (see ICONS constant) — same visual
     role as Font Awesome, zero network calls, zero license concerns.
  3. Typography: 'Inter' is requested as primary font, but bundling it as
     base64 would add >100KB per weight with no runtime network access to
     fetch it otherwise. The font-stack below degrades to the OS-native
     fallback the spec itself lists (Segoe UI / Roboto / Arial), so nothing
     ever tries to reach the network for a font.
  4. Passwords are never stored in cleartext, even client-side. SHA-256
     digests are compared instead. This is NOT real security — anyone with
     devtools can read this source and brute-force two known strings.
     Genuine access control requires a server. This is the strongest
     feasible *client-side* safeguard, and is documented here as required
     by the specification.
  ============================================================================
-->

<style>
/* ============================================================================
   SECTION: DESIGN TOKENS
   ============================================================================
   Centralized design system. Every color, spacing, radius, shadow and font
   size used anywhere in the app must reference one of these tokens — never
   a hardcoded literal — so the whole UI stays visually consistent and the
   theme engine can swap every surface at once.
   ============================================================================ */
:root{
  /* Spacing (8px system) */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-6:24px; --space-8:32px; --space-12:48px; --space-16:64px;

  /* Radius */
  --radius-sm:8px;   /* buttons, inputs, tables */
  --radius-md:12px;  /* cards, charts */
  --radius-lg:16px;  /* dialogs */

  /* Typography */
  --font-family: 'Inter','Segoe UI',Roboto,Arial,sans-serif;
  --fs-app-title:28px;
  --fs-page-title:24px;
  --fs-section-title:20px;
  --fs-card-title:16px;
  --fs-body:14px;
  --fs-table:13px;
  --fs-small:12px;
  --fs-caption:11px;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;

  /* Motion */
  --dur-hover:150ms; --dur-fast:200ms; --dur-sidebar:300ms; --dur-dialog:250ms; --dur-chart:400ms;
  --ease-standard: cubic-bezier(.4,0,.2,1);

  /* Semantic (theme-independent) */
  --color-primary:#2563EB;
  --color-accent:#3B82F6;
  --color-success:#22C55E;
  --color-warning:#F59E0B;
  --color-danger:#EF4444;
  --color-info:#06B6D4;
  --color-forecast:#8B5CF6;

  --z-header:100; --z-sidebar:90; --z-dialog:1000; --z-notify:1100; --z-splash:2000;
}

:root, :root[data-theme="dark"]{
  --bg-primary:#0F172A;
  --bg-secondary:#111827;
  --bg-card:#1E293B;
  --bg-card-hover:#243349;
  --bg-input:#111827;
  --border-color:#334155;
  --text-primary:#F1F5F9;
  --text-secondary:#94A3B8;
  --text-muted:#64748B;
  --shadow-1: 0 1px 2px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.2);
  --shadow-2: 0 4px 12px rgba(0,0,0,.4);
  --shadow-3: 0 12px 32px rgba(0,0,0,.5);
  --overlay: rgba(15,23,42,.72);
  --glass-bg: rgba(30,41,59,.55);
  --glass-border: rgba(148,163,184,.18);
}

:root[data-theme="light"]{
  --bg-primary:#F8FAFC;
  --bg-secondary:#EEF2F7;
  --bg-card:#FFFFFF;
  --bg-card-hover:#F4F7FB;
  --bg-input:#FFFFFF;
  --border-color:#CBD5E1;
  --text-primary:#0F172A;
  --text-secondary:#475569;
  --text-muted:#94A3B8;
  --shadow-1: 0 1px 2px rgba(15,23,42,.06), 0 1px 1px rgba(15,23,42,.04);
  --shadow-2: 0 4px 16px rgba(15,23,42,.10);
  --shadow-3: 0 16px 40px rgba(15,23,42,.16);
  --overlay: rgba(15,23,42,.35);
  --glass-bg: rgba(255,255,255,.65);
  --glass-border: rgba(15,23,42,.08);
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ============================================================================
   SECTION: RESET & BASE
   ============================================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; font-family:var(--font-family); font-size:var(--fs-body);
  color:var(--text-primary); background:var(--bg-primary);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition: background-color var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard);
}
h1,h2,h3,h4,p,ul,figure{ margin:0; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
ul{ list-style:none; padding:0; }
a{ color:inherit; }
svg{ display:block; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border-color); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-muted); }
:focus-visible{ outline:2px solid var(--color-accent); outline-offset:2px; border-radius:4px; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
[hidden]{ display:none !important; }

/* ============================================================================
   SECTION: ICONS  (self-authored inline SVG set — see disclosure at top)
   ============================================================================ */
.icon{ width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.icon-sm{ width:16px; height:16px; }
.icon-lg{ width:24px; height:24px; }
.icon-xl{ width:32px; height:32px; }

/* ============================================================================
   SECTION: SPLASH / LOADING SCREEN
   ============================================================================ */
#screen-splash{
  position:fixed; inset:0; z-index:var(--z-splash); background:var(--bg-primary);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--space-6);
  transition:opacity var(--dur-dialog) var(--ease-standard);
}
.splash-logo{
  width:64px; height:64px; border-radius:var(--radius-md);
  background:linear-gradient(135deg,var(--color-primary),var(--color-forecast));
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-3);
}
.splash-logo .icon{ width:32px; height:32px; color:#fff; }
.splash-title{ font-size:var(--fs-page-title); font-weight:var(--fw-semibold); letter-spacing:.2px; }
.splash-step{ color:var(--text-secondary); font-size:var(--fs-small); min-height:16px; }
.splash-bar{ width:220px; height:4px; border-radius:4px; background:var(--border-color); overflow:hidden; }
.splash-bar-fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--color-primary),var(--color-accent)); transition:width var(--dur-fast) var(--ease-standard); }

/* ============================================================================
   SECTION: LOGIN PAGE
   ============================================================================ */
#screen-login{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  padding:var(--space-6);
  background:
    radial-gradient(1200px 600px at 15% 10%, rgba(59,130,246,.20), transparent 60%),
    radial-gradient(1000px 700px at 85% 90%, rgba(139,92,246,.18), transparent 60%),
    var(--bg-primary);
}
.login-card{
  width:min(420px, 100%); background:var(--glass-bg); border:1px solid var(--glass-border);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-radius:var(--radius-lg); box-shadow:var(--shadow-3);
  padding:var(--space-8); display:flex; flex-direction:column; gap:var(--space-6);
  animation:fadeUp var(--dur-dialog) var(--ease-standard);
}
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
.login-brand{ display:flex; flex-direction:column; align-items:center; gap:var(--space-3); text-align:center; }
.login-logo{ width:56px; height:56px; border-radius:var(--radius-md); background:linear-gradient(135deg,var(--color-primary),var(--color-forecast)); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-2); }
.login-logo .icon{ color:#fff; width:28px; height:28px; }
.login-app-name{ font-size:var(--fs-section-title); font-weight:var(--fw-semibold); }
.login-app-sub{ font-size:var(--fs-small); color:var(--text-secondary); }
.login-form{ display:flex; flex-direction:column; gap:var(--space-4); }
.field{ display:flex; flex-direction:column; gap:var(--space-2); }
.field label{ font-size:var(--fs-small); font-weight:var(--fw-medium); color:var(--text-secondary); }
.required-mark{ color:var(--color-danger); margin-inline-start:2px; }
.input, select.input{
  height:40px; padding:0 var(--space-3); border-radius:var(--radius-sm);
  border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-primary);
  transition:border-color var(--dur-hover), box-shadow var(--dur-hover);
}
.input:hover{ border-color:var(--text-muted); }
.input:focus{ border-color:var(--color-accent); box-shadow:0 0 0 3px rgba(59,130,246,.18); }
.input.has-error{ border-color:var(--color-danger); }
.password-field{ position:relative; }
.password-field .input{ width:100%; padding-inline-end:40px; }
.password-toggle{
  position:absolute; right:4px; top:4px; width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  background:transparent; border:none; border-radius:var(--radius-sm); color:var(--text-secondary);
}
.password-toggle:hover{ background:var(--bg-card-hover); color:var(--text-primary); }
.field-error{ color:var(--color-danger); font-size:var(--fs-caption); min-height:14px; display:flex; align-items:center; gap:4px; }
.checkbox-row{ display:flex; align-items:center; gap:var(--space-2); font-size:var(--fs-small); color:var(--text-secondary); }
.checkbox-row input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--color-primary); }

.btn{
  height:40px; padding:0 var(--space-4); border-radius:var(--radius-sm); border:1px solid transparent;
  font-size:var(--fs-body); font-weight:var(--fw-semibold); display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2);
  transition:transform var(--dur-hover) var(--ease-standard), filter var(--dur-hover), box-shadow var(--dur-hover), background-color var(--dur-hover);
  white-space:nowrap;
}
.btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-2); }
.btn:active{ transform:translateY(0); filter:brightness(.95); }
.btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }
.btn-sm{ height:32px; padding:0 var(--space-3); font-size:var(--fs-small); }
.btn-lg{ height:48px; padding:0 var(--space-6); }
.btn-block{ width:100%; }
.btn-primary{ background:var(--color-primary); color:#fff; }
.btn-secondary{ background:var(--bg-card-hover); color:var(--text-primary); border-color:var(--border-color); }
.btn-success{ background:var(--color-success); color:#06240f; }
.btn-warning{ background:var(--color-warning); color:#2b1900; }
.btn-danger{ background:var(--color-danger); color:#fff; }
.btn-ghost{ background:transparent; color:var(--text-secondary); }
.btn-ghost:hover{ background:var(--bg-card-hover); color:var(--text-primary); }
.btn .spinner{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.login-meta-row{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); }
.chip-toggle-group{ display:flex; border:1px solid var(--border-color); border-radius:var(--radius-sm); overflow:hidden; }
.chip-toggle{ padding:6px 10px; font-size:var(--fs-caption); background:transparent; border:none; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
.chip-toggle.active{ background:var(--color-primary); color:#fff; }
.login-footer-row{ display:flex; align-items:center; justify-content:center; gap:var(--space-2); font-size:var(--fs-caption); color:var(--text-muted); }
.offline-badge{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:rgba(34,197,94,.12); color:var(--color-success); font-size:var(--fs-caption); font-weight:var(--fw-medium); border:1px solid rgba(34,197,94,.35); }
.offline-badge .icon{ width:12px; height:12px; }

/* ============================================================================
   SECTION: APP SHELL — HEADER / SIDEBAR / FOOTER
   ============================================================================ */
#app-shell{ display:none; height:100vh; overflow:hidden; }
#app-shell.active{ display:grid; grid-template-columns:auto 1fr; grid-template-rows:72px 1fr 32px; grid-template-areas:"sidebar header" "sidebar main" "sidebar footer"; }

.app-header{
  grid-area:header; display:flex; align-items:center; justify-content:space-between; gap:var(--space-4);
  padding:0 var(--space-6); background:var(--bg-card); border-bottom:1px solid var(--border-color);
  position:sticky; top:0; z-index:var(--z-header);
}
.header-left{ display:flex; align-items:center; gap:var(--space-4); min-width:0; }
.header-title{ font-size:var(--fs-card-title); font-weight:var(--fw-semibold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.header-period{ font-size:var(--fs-caption); color:var(--text-secondary); background:var(--bg-secondary); border:1px solid var(--border-color); padding:4px 10px; border-radius:999px; white-space:nowrap; }
.header-right{ display:flex; align-items:center; gap:var(--space-2); }
.icon-btn{ width:40px; height:40px; border-radius:var(--radius-sm); background:transparent; border:1px solid transparent; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; position:relative; transition:background var(--dur-hover), color var(--dur-hover); }
.icon-btn:hover{ background:var(--bg-card-hover); color:var(--text-primary); }
.icon-btn .badge-dot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--color-danger); border:2px solid var(--bg-card); }
.theme-lang-group{ display:flex; align-items:center; gap:4px; padding:4px; border:1px solid var(--border-color); border-radius:var(--radius-sm); }
.user-menu{ display:flex; align-items:center; gap:var(--space-2); padding:6px 10px 6px 6px; border-radius:var(--radius-sm); border:1px solid var(--border-color); background:var(--bg-secondary); cursor:pointer; position:relative; }
.user-avatar{ width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--color-primary),var(--color-forecast)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:var(--fs-caption); font-weight:var(--fw-bold); }
.user-meta{ display:flex; flex-direction:column; line-height:1.2; }
.user-name{ font-size:var(--fs-small); font-weight:var(--fw-medium); }
.user-role{ font-size:var(--fs-caption); color:var(--text-secondary); }
.user-dropdown{ position:absolute; top:calc(100% + 6px); right:0; min-width:200px; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-md); box-shadow:var(--shadow-3); padding:var(--space-2); display:none; flex-direction:column; gap:2px; z-index:var(--z-header); }
.user-dropdown.open{ display:flex; animation:fadeUp var(--dur-hover) var(--ease-standard); }
.user-dropdown-item{ display:flex; align-items:center; gap:var(--space-2); padding:8px 10px; border-radius:var(--radius-sm); font-size:var(--fs-small); background:transparent; border:none; width:100%; text-align:left; color:var(--text-primary); }
.user-dropdown-item:hover{ background:var(--bg-card-hover); }
.user-dropdown-item.danger{ color:var(--color-danger); }

.app-sidebar{
  grid-area:sidebar; width:280px; background:var(--bg-secondary); border-right:1px solid var(--border-color);
  display:flex; flex-direction:column; transition:width var(--dur-sidebar) var(--ease-standard); overflow:hidden;
}
.app-sidebar.collapsed{ width:72px; }
.sidebar-brand{ display:flex; align-items:center; gap:var(--space-3); padding:var(--space-4) var(--space-4); height:72px; border-bottom:1px solid var(--border-color); flex:none; }
.sidebar-brand .login-logo{ width:36px; height:36px; flex:none; }
.sidebar-brand .login-logo .icon{ width:18px; height:18px; }
.sidebar-brand-text{ display:flex; flex-direction:column; line-height:1.2; overflow:hidden; white-space:nowrap; }
.sidebar-brand-name{ font-size:var(--fs-small); font-weight:var(--fw-semibold); }
.sidebar-brand-sub{ font-size:var(--fs-caption); color:var(--text-muted); }
.app-sidebar.collapsed .sidebar-brand-text{ display:none; }

.sidebar-nav{ flex:1; overflow-y:auto; padding:var(--space-3); display:flex; flex-direction:column; gap:2px; }
.nav-item{
  display:flex; align-items:center; gap:var(--space-3); padding:10px var(--space-3); border-radius:var(--radius-sm);
  color:var(--text-secondary); background:transparent; border:none; width:100%; text-align:left; position:relative;
  transition:background var(--dur-hover), color var(--dur-hover);
}
.nav-item .icon{ flex:none; }
.nav-item span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-small); font-weight:var(--fw-medium); }
.nav-item:hover{ background:var(--bg-card-hover); color:var(--text-primary); }
.nav-item.active{ background:rgba(37,99,235,.16); color:var(--color-accent); }
.nav-item.active::before{ content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--color-primary); }
.app-sidebar.collapsed .nav-item span{ display:none; }
.app-sidebar.collapsed .nav-item{ justify-content:center; }
.app-sidebar.collapsed .nav-item.active::before{ left:0; }
.nav-divider{ height:1px; background:var(--border-color); margin:var(--space-3) var(--space-2); flex:none; }
.sidebar-footer{ flex:none; padding:var(--space-3); border-top:1px solid var(--border-color); display:flex; flex-direction:column; gap:2px; }

.app-main{ grid-area:main; overflow-y:auto; background:var(--bg-primary); }
.page-container{ max-width:1920px; margin:0 auto; padding:var(--space-6); display:flex; flex-direction:column; gap:var(--space-6); }
.page-header{ display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:var(--space-4); }
.page-title{ font-size:var(--fs-page-title); font-weight:var(--fw-semibold); }
.page-subtitle{ font-size:var(--fs-body); color:var(--text-secondary); margin-top:4px; max-width:640px; }

.app-footer{
  grid-area:footer; display:flex; align-items:center; justify-content:space-between; gap:var(--space-4);
  padding:0 var(--space-6); background:var(--bg-secondary); border-top:1px solid var(--border-color);
  font-size:var(--fs-caption); color:var(--text-muted);
}
.footer-group{ display:flex; align-items:center; gap:var(--space-4); }
.footer-status{ display:flex; align-items:center; gap:6px; }
.status-dot{ width:7px; height:7px; border-radius:50%; background:var(--color-success); }

/* ============================================================================
   SECTION: CARDS / EMPTY STATES / BADGES
   ============================================================================ */
.card{ background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-md); box-shadow:var(--shadow-1); padding:var(--space-6); transition:box-shadow var(--dur-hover), transform var(--dur-hover), border-color var(--dur-hover); }
.card-hover:hover{ box-shadow:var(--shadow-2); border-color:var(--text-muted); transform:translateY(-1px); }
.card-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-4); }
.card-title{ font-size:var(--fs-card-title); font-weight:var(--fw-semibold); display:flex; align-items:center; gap:var(--space-2); }
.card-subtitle{ font-size:var(--fs-small); color:var(--text-secondary); }

.status-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:var(--space-4); }
.status-tile{ background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:var(--space-4); display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow-1); }
.status-tile-top{ display:flex; align-items:center; justify-content:space-between; }
.status-tile-icon{ width:36px; height:36px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; }
.status-tile-value{ font-size:var(--fs-section-title); font-weight:var(--fw-bold); }
.status-tile-label{ font-size:var(--fs-caption); color:var(--text-secondary); text-transform:uppercase; letter-spacing:.4px; }

.badge{ display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px; font-size:var(--fs-caption); font-weight:var(--fw-medium); }
.badge-success{ background:rgba(34,197,94,.14); color:var(--color-success); }
.badge-warning{ background:rgba(245,158,11,.14); color:var(--color-warning); }
.badge-danger{ background:rgba(239,68,68,.14); color:var(--color-danger); }
.badge-info{ background:rgba(6,182,212,.14); color:var(--color-info); }

    let h1 = 5381, h2 = 52711;
    for (let i=0;i<text.length;i++){
      const c = text.charCodeAt(i);
      h1 = (h1*33) ^ c; h2 = (h2*33) ^ c;
    }
    return (h1>>>0).toString(16).padStart(8,'0') + (h2>>>0).toString(16).padStart(8,'0');
  }
  function clamp(n,min,max){ return Math.min(Math.max(n,min),max); }
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  return { debounce, uuid, hashText, clamp, escapeHtml };
})();

/* ============================================================================
   SECTION 4: LOCAL STORAGE ENGINE
   Purpose   : thin, crash-proof wrapper over window.localStorage/sessionStorage.
               Business data must NEVER go through this — only UI-level
               preferences and the session token (see IndexedDB Engine, Phase 2).
   ============================================================================ */
App.LocalStore = (() => {
  function get(key, fallback=null){
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  }
  function set(key, value){
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable — degrade silently, non-critical */ }
  }
  function remove(key){ try { localStorage.removeItem(key); } catch {} }

  function getSession(key, fallback=null){
    try {
      const raw = sessionStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  }
  function setSession(key, value){
    try { sessionStorage.setItem(key, JSON.stringify(value)); } catch {}
  }
  function removeSession(key){ try { sessionStorage.removeItem(key); } catch {} }

  return { get, set, remove, getSession, setSession, removeSession };
})();

/* ============================================================================
   SECTION 5: APPLICATION STATE
   Purpose   : single centralized store every engine reads from / writes to.
               Simple pub/sub — deliberately not a framework: this is a plain
               script file, and the state surface is small and well-known.
   ============================================================================ */
App.State = (() => {
  const state = {
    currentUser: null,      // { roleId, permissions[] }
    theme: App.Config.DEFAULT_THEME,
    language: App.Config.DEFAULT_LANGUAGE,
    currentPage: 'dashboard',
    sidebarCollapsed: false,
    sessionExpiresAt: null
  };
  const listeners = new Set();
  function get(key){ return key ? state[key] : { ...state }; }
  function set(patch){
    Object.assign(state, patch);
    listeners.forEach(fn => fn(state, patch));
  }
  function subscribe(fn){ listeners.add(fn); return () => listeners.delete(fn); }
  return { get, set, subscribe };
})();

/* ============================================================================
   SECTION 7: THEME ENGINE
   Purpose   : instant dark/light theme switching. Every color in the CSS
               above is a variable, so this only ever toggles one attribute.
   ============================================================================ */
App.Theme = (() => {
  function apply(theme, { persist=true, silent=false } = {}){
    if (!App.Config.SUPPORTED_THEMES.includes(theme)) return;
    document.documentElement.setAttribute('data-theme', theme);
    App.State.set({ theme });
    if (persist) App.LocalStore.set(App.Config.STORAGE_KEYS.THEME, theme);
    App.Shell && App.Shell.syncThemeButtons && App.Shell.syncThemeButtons();
    if (!silent) App.Notify.show('info', App.I18n.t('notify.themeChangedTitle'), '');
  }
  function toggle(){
    apply(App.State.get('theme') === 'dark' ? 'light' : 'dark');
  }
  function init(){
    const stored = App.LocalStore.get(App.Config.STORAGE_KEYS.THEME);
    const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    apply(stored || (prefersLight ? 'light' : App.Config.DEFAULT_THEME), { persist:false, silent:true });
  }
  return { apply, toggle, init };
})();

/* ============================================================================
   SECTION 8: NOTIFICATION ENGINE
   Purpose   : queued toast notifications (top-right, auto-hide + manual close).
   ============================================================================ */
App.Notify = (() => {
  const container = () => document.getElementById('notification-container');
  const ICONS = { success:'check', error:'danger', warning:'warning', info:'info' };
  const AUTO_HIDE_MS = 5000;

  function show(type, title, message, { duration=AUTO_HIDE_MS } = {}){
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `
      <div class="toast-icon">${App.Icons.svg(ICONS[type] || 'info','icon icon-sm')}</div>
      <div class="toast-body">
        <div class="toast-title"></div>
        <div class="toast-message"></div>
      </div>
      <button class="toast-close" aria-label="${App.Utils.escapeHtml(App.I18n.t('common.close'))}">${App.Icons.svg('close','icon icon-sm')}</button>
    `;
    el.querySelector('.toast-title').textContent = title;
    el.querySelector('.toast-message').textContent = message || '';
    const remove = () => {
      el.classList.add('leaving');
      setTimeout(() => el.remove(), 220);
    };
    el.querySelector('.toast-close').addEventListener('click', remove);
    container().appendChild(el);
    if (duration > 0) setTimeout(remove, duration);
    return el;
  }
  return { show };
})();

/* ============================================================================
   SECTION 9: DIALOG ENGINE
   Purpose   : modal dialogs for confirmation / warning / info / error / question.
   ============================================================================ */
App.Dialog = (() => {
  const ICON_MAP = {
    confirmation:{ icon:'question', bg:'rgba(37,99,235,.15)', color:'var(--color-primary)' },
    warning:     { icon:'warning',  bg:'rgba(245,158,11,.15)', color:'var(--color-warning)' },
    success:     { icon:'check',    bg:'rgba(34,197,94,.15)', color:'var(--color-success)' },
    information: { icon:'info',     bg:'rgba(6,182,212,.15)', color:'var(--color-info)' },
    error:       { icon:'danger',   bg:'rgba(239,68,68,.15)', color:'var(--color-danger)' },
    question:    { icon:'question', bg:'rgba(139,92,246,.15)', color:'var(--color-forecast)' }
  };

  function open({ type='information', title, message, confirmLabel, cancelLabel, onConfirm, onCancel, hideCancel=false }){
    const cfg = ICON_MAP[type] || ICON_MAP.information;
    const container = document.getElementById('dialog-container');
    container.innerHTML = `
      <div class="dialog">
        <div class="dialog-icon-row">
          <div class="dialog-icon" style="background:${cfg.bg};color:${cfg.color}">${App.Icons.svg(cfg.icon,'icon')}</div>
          <div class="dialog-title"></div>
        </div>
        <div class="dialog-message"></div>
        <div class="dialog-actions">
          ${hideCancel ? '' : `<button class="btn btn-secondary" data-action="cancel"></button>`}
          <button class="btn btn-primary" data-action="confirm"></button>
        </div>
      </div>`;
    container.querySelector('.dialog-title').textContent = title;
    container.querySelector('.dialog-message').textContent = message;
    const confirmBtn = container.querySelector('[data-action="confirm"]');
    confirmBtn.textContent = confirmLabel || App.I18n.t('common.confirm');
    confirmBtn.addEventListener('click', () => { close(); onConfirm && onConfirm(); });
    const cancelBtn = container.querySelector('[data-action="cancel"]');
    if (cancelBtn){
      cancelBtn.textContent = cancelLabel || App.I18n.t('common.cancel');
      cancelBtn.addEventListener('click', () => { close(); onCancel && onCancel(); });
    }
    container.classList.add('open');
    const escHandler = (e) => { if (e.key === 'Escape'){ close(); onCancel && onCancel(); } };
    document.addEventListener('keydown', escHandler, { once:true });
  }
  function close(){
    document.getElementById('dialog-container').classList.remove('open');
  }
  return { open, close };
})();

/* ============================================================================
   SECTION 10: AUTHENTICATION ENGINE
   Purpose   : validates the two predefined role/password pairs, manages a
               locally-stored, expiring session, and restores it on reopen.
   Dependency: Config, Utils (hashText), LocalStore, State, Notify.
   Security note: this is client-side only. See top-of-file disclosure.
   ============================================================================ */
App.Auth = (() => {
  let expiryTimer = null;

  function findRoleByPasswordHash(hash){
    return Object.values(App.Config.ROLES).find(r => r.passwordHash === hash) || null;
  }

  async function login(roleId, password, remember){
    const role = App.Config.ROLES[roleId];
    if (!role) return { ok:false, reason:'unknown-role' };
    const hash = await App.Utils.hashText(password);
    if (hash !== role.passwordHash) return { ok:false, reason:'invalid-password' };

    const expiresAt = Date.now() + App.Config.SESSION.DURATION_MINUTES * 60 * 1000;
    const session = { roleId: role.id, expiresAt, remember: !!remember };
    if (remember) App.LocalStore.set(App.Config.SESSION.STORAGE_KEY, session);
    else App.LocalStore.setSession(App.Config.SESSION.STORAGE_KEY, session);

    App.State.set({ currentUser: { roleId: role.id, permissions: role.permissions }, sessionExpiresAt: expiresAt });
    scheduleExpiry(expiresAt);
    return { ok:true, role };
  }

  function logout({ silent=false } = {}){
    App.LocalStore.remove(App.Config.SESSION.STORAGE_KEY);
    App.LocalStore.removeSession(App.Config.SESSION.STORAGE_KEY);
    App.State.set({ currentUser:null, sessionExpiresAt:null });
    if (expiryTimer) clearTimeout(expiryTimer);
    if (!silent) App.Notify.show('info', App.I18n.t('notify.logoutTitle'), App.I18n.t('notify.logoutMsg'));
  }

  function scheduleExpiry(expiresAt){
    if (expiryTimer) clearTimeout(expiryTimer);
    const ms = expiresAt - Date.now();
    if (ms <= 0) { forceExpire(); return; }
    expiryTimer = setTimeout(forceExpire, ms);
  }

  function forceExpire(){
    logout({ silent:true });
    App.Notify.show('warning', App.I18n.t('notify.sessionExpiredTitle'), App.I18n.t('notify.sessionExpiredMsg'), { duration:0 });
    App.Shell.showLogin();
  }

  function restoreSession(){
    const persisted = App.LocalStore.get(App.Config.SESSION.STORAGE_KEY);
    const volatile = App.LocalStore.getSession(App.Config.SESSION.STORAGE_KEY);
    const session = persisted || volatile;
    if (!session) return false;
    if (session.expiresAt <= Date.now()){
      App.LocalStore.remove(App.Config.SESSION.STORAGE_KEY);
      App.LocalStore.removeSession(App.Config.SESSION.STORAGE_KEY);
      return false;
    }
    const role = App.Config.ROLES[session.roleId];
    if (!role) return false;
    App.State.set({ currentUser: { roleId: role.id, permissions: role.permissions }, sessionExpiresAt: session.expiresAt });
    scheduleExpiry(session.expiresAt);
    return true;
  }

  function isAuthenticated(){ return !!App.State.get('currentUser'); }
  function getCurrentUser(){ return App.State.get('currentUser'); }

  return { login, logout, restoreSession, isAuthenticated, getCurrentUser };
})();

/* ============================================================================
   SECTION 11: AUTHORIZATION ENGINE
   Purpose   : central permission checks. UI hiding (Shell) is a convenience —
               this module is the actual guard every privileged action must
               call, so the check exists even if a control were ever exposed
               in markup by mistake.
   ============================================================================ */
App.Authz = (() => {
  function can(permission){
    const user = App.Auth.getCurrentUser();
    if (!user) return false;
    return user.permissions.includes(permission);
  }
  function isAdmin(){
    const user = App.Auth.getCurrentUser();
    return !!user && user.roleId === 'ADMINISTRATOR';
  }
  /* Wrap any privileged action: guard(permission, fn) runs fn() only if
     authorized, otherwise shows a friendly, localized denial dialog and
     returns false. Never lets a caller "peek" at protected logic. */
  function guard(permission, fn){
    if (!can(permission)){
      App.Dialog.open({
        type:'warning',
        title: App.I18n.t('dialog.unauthorizedTitle'),
        message: App.I18n.t('dialog.unauthorizedMessage'),
        hideCancel:true
      });
      return false;
    }
    fn();
    return true;
  }
  return { can, isAdmin, guard };
})();

/* ============================================================================
   SECTION 12: APPLICATION SHELL (Navigation / Header / Sidebar / Footer / Pages)
   Purpose   : renders the authenticated shell, guards routes through Authz,
               and renders each page. Only Phase 1 content (system status +
               honest "scheduled" empty states) exists here — later phases
               will replace `renderPageBody()` cases module by module without
               touching navigation, auth, theme or language code.
   ============================================================================ */
App.Shell = (() => {
  function buildSidebarNav(){
    const nav = document.getElementById('sidebar-nav');
    nav.innerHTML = '';
    App.Config.NAV_ITEMS.forEach(item => {
      if (item.permission && !App.Authz.can(item.permission)) return; // never rendered, not just hidden
      if (item.divider) {
        const d = document.createElement('div'); d.className = 'nav-divider'; nav.appendChild(d);
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'nav-item';
      btn.dataset.page = item.id;
      btn.innerHTML = `${App.Icons.svg(item.icon)}<span data-i18n="${item.labelKey}"></span>`;
      btn.addEventListener('click', () => navigateTo(item.id));
      nav.appendChild(btn);
    });
    App.I18n.applyTranslations(nav);
  }

  function syncActiveNav(){
    document.querySelectorAll('.nav-item[data-page]').forEach(el => {
      el.classList.toggle('active', el.dataset.page === App.State.get('currentPage'));
    });
  }

  function syncThemeButtons(){
    const theme = App.State.get('theme');
    document.querySelectorAll('[data-theme-choice]').forEach(el => {
      el.classList.toggle('active', el.dataset.themeChoice === theme);
    });
  }
  function syncLangButtons(){
    const lang = App.I18n.getLanguage();
    document.querySelectorAll('[data-lang]').forEach(el => {
      el.classList.toggle('active', el.dataset.lang === lang);
    });
  }

  function navigateTo(pageId){
    const item = App.Config.NAV_ITEMS.find(n => n.id === pageId);
    if (!item) return;
    if (item.permission && !App.Authz.can(item.permission)){
      App.Authz.guard(item.permission, () => {}); // shows the friendly denial
      return;
    }
    App.State.set({ currentPage: pageId });
    App.LocalStore.set(App.Config.STORAGE_KEYS.LAST_PAGE, pageId);
    syncActiveNav();
    renderPage(pageId);
  }

  function refreshCurrentPage(){
    // Only meaningful once the shell is actually on screen (post-login).
    // Language/theme can change on the login screen itself, before any
    // page has ever been rendered — this must be a safe no-op then.
    if (!document.getElementById('app-shell').classList.contains('active')) return;
    renderPage(App.State.get('currentPage'));
  }

  function statusTile(icon, colorVar, labelKey, valueText){
    return `
      <div class="status-tile">
        <div class="status-tile-top">
          <div class="status-tile-icon" style="background:rgba(37,99,235,.12);color:${colorVar}">${App.Icons.svg(icon,'icon icon-sm')}</div>
        </div>
        <div class="status-tile-value">${App.Utils.escapeHtml(valueText)}</div>
        <div class="status-tile-label" data-i18n="${labelKey}"></div>
      </div>`;
  }

  function renderDashboardPage(){
    const user = App.Auth.getCurrentUser();
    if (!user) return renderModulePlaceholder('dashboard'); // defensive: should be unreachable post-login
    const roleLabel = App.I18n.t(App.Config.ROLES[user.roleId].labelKey);
    const expires = new Date(App.State.get('sessionExpiresAt'));
    const timeStr = expires.toLocaleString(App.I18n.getLanguage() === 'tr' ? 'tr-TR' : 'az-Latn-AZ', { dateStyle:'medium', timeStyle:'short' });
    const themeLabel = App.State.get('theme') === 'dark' ? 'Dark' : 'Light';
    const langLabel = App.I18n.getLanguage().toUpperCase();

    const roadmap = [
      { phase:'Phase 2', name:'Data Layer', desc:'IndexedDB, Excel Import Wizard, Validation & Normalization' },
      { phase:'Phase 3', name:'Business Layer', desc:'Formula Engine, Business Rules, Filter Engine' },
      { phase:'Phase 4', name:'Presentation Layer', desc:'Dashboard KPIs, Charts, Tree Tables' },
      { phase:'Phase 5', name:'Business Modules', desc:'Sales, Bonus, Forecast, Comparison, Rankings, Trend' },
      { phase:'Phase 6', name:'Advanced Features', desc:'AI Insights, Export, Backup, KPI/Bonus Config Center' },
      { phase:'Phase 7', name:'Optimization', desc:'Performance, accessibility, error handling, memory' },
      { phase:'Phase 8', name:'Quality Assurance', desc:'Functional, UI, performance & regression testing' }
    ];

    return `
      <div class="page-header">
        <div>
          <h2 class="page-title" data-i18n="nav.dashboard"></h2>
          <p class="page-subtitle" data-i18n="dashboard.welcomeDesc"></p>
        </div>
      </div>

      <div class="card">
        <div class="card-title-row">
          <div class="card-title">${App.Icons.svg('layers','icon')}<span data-i18n="dashboard.welcomeTitle"></span></div>
          <span class="badge badge-info">${App.Utils.escapeHtml(App.Config.BUILD_PHASE)}</span>
        </div>
        <div class="status-grid">
          ${statusTile('layers','var(--color-info)','status.phase', App.Config.BUILD_PHASE)}
          ${statusTile('user','var(--color-primary)','status.role', roleLabel)}
          ${statusTile('clock','var(--color-warning)','status.theme', themeLabel)}
          ${statusTile('info','var(--color-success)','status.language', langLabel)}
          ${statusTile('clock','var(--color-danger)','status.session', timeStr)}
          ${statusTile('database','var(--color-forecast)','status.version', App.Config.VERSION)}
        </div>
      </div>

      <div class="card">
        <div class="card-title-row">
          <div class="card-title">${App.Icons.svg('trend','icon')}<span data-i18n="dashboard.roadmapTitle"></span></div>
        </div>
        <div class="roadmap-list">
          ${roadmap.map(r => `
            <div class="roadmap-item">
              ${App.Icons.svg('layers','icon icon-sm')}
              <div class="roadmap-item-text">
                <div class="roadmap-item-name">${App.Utils.escapeHtml(r.phase)} — ${App.Utils.escapeHtml(r.name)}</div>
                <div class="roadmap-item-desc">${App.Utils.escapeHtml(r.desc)}</div>
              </div>
              <span class="badge badge-neutral">scheduled</span>
            </div>`).join('')}
        </div>
      </div>
    `;
  }

  function renderModulePlaceholder(pageId){
    const item = App.Config.NAV_ITEMS.find(n => n.id === pageId);
    const phase = App.Config.MODULE_PHASE_MAP[pageId] || 'a later phase';
    return `
      <div class="page-header">
        <div>
          <h2 class="page-title" data-i18n="${item.labelKey}"></h2>
        </div>
      </div>
      <div class="empty-state">
        ${App.Icons.svg(item.icon,'icon icon-xl')}
        <div class="empty-state-title" data-i18n="empty.moduleTitle"></div>
        <div class="empty-state-desc" data-i18n="empty.moduleDesc"></div>
        <span class="badge badge-info empty-state-phase">${App.Utils.escapeHtml(App.I18n.t('empty.modulePhase', { phase }))}</span>
      </div>
    `;
  }

  function renderPage(pageId){
    const container = document.getElementById('page-container');
    container.innerHTML = pageId === 'dashboard' ? renderDashboardPage() : renderModulePlaceholder(pageId);
    App.I18n.applyTranslations(container);
    const item = App.Config.NAV_ITEMS.find(n => n.id === pageId);
    document.getElementById('header-page-title').textContent = App.I18n.t(item.labelKey);
  }

  function syncUserMenu(){
    const user = App.Auth.getCurrentUser();
    if (!user) return;
    const role = App.Config.ROLES[user.roleId];
    const roleLabel = App.I18n.t(role.labelKey);
    document.getElementById('user-avatar').textContent = roleLabel.charAt(0).toUpperCase();
    document.getElementById('user-name-label').textContent = roleLabel;
    document.getElementById('user-role-label').textContent = user.roleId === 'ADMINISTRATOR' ? 'Admin' : 'User';
  }

  function showApp(){
    document.getElementById('screen-login').hidden = true;
    document.getElementById('app-shell').classList.add('active');
    document.getElementById('footer-version').textContent = `${App.I18n.t('footer.version')} ${App.Config.VERSION}`;
    document.getElementById('footer-lastbackup').textContent = `${App.I18n.t('footer.lastBackup')}: ${App.I18n.t('footer.notConfigured')}`;
    document.getElementById('footer-indexeddb').textContent = `${App.I18n.t('footer.indexeddb')}: ${App.I18n.t('footer.notConfigured')}`;
    buildSidebarNav();
    syncUserMenu();
    syncThemeButtons();
    syncLangButtons();
    const collapsed = App.LocalStore.get(App.Config.STORAGE_KEYS.SIDEBAR_COLLAPSED, false);
    document.getElementById('app-sidebar').classList.toggle('collapsed', collapsed);
    const lastPage = App.LocalStore.get(App.Config.STORAGE_KEYS.LAST_PAGE, 'dashboard');
    const validPage = App.Config.NAV_ITEMS.some(n => n.id === lastPage && (!n.permission || App.Authz.can(n.permission)));
    navigateTo(validPage ? lastPage : 'dashboard');
  }

  function showLogin(){
    document.getElementById('app-shell').classList.remove('active');
    document.getElementById('screen-login').hidden = false;
    document.getElementById('login-password').value = '';
    document.getElementById('login-error').textContent = '';
    document.getElementById('login-remember').checked = false;
  }

  function initShellEvents(){
    document.getElementById('sidebar-collapse-btn').addEventListener('click', () => {
      const el = document.getElementById('app-sidebar');
      const collapsed = !el.classList.contains('collapsed');
      el.classList.toggle('collapsed', collapsed);
      App.LocalStore.set(App.Config.STORAGE_KEYS.SIDEBAR_COLLAPSED, collapsed);
    });
    document.getElementById('user-menu').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('user-dropdown').classList.toggle('open');
    });
    document.addEventListener('click', () => document.getElementById('user-dropdown').classList.remove('open'));
    document.getElementById('btn-logout').addEventListener('click', () => {
      App.Auth.logout();
      showLogin();
    });
    document.querySelectorAll('[data-theme-choice]').forEach(el => {
      el.addEventListener('click', () => App.Theme.apply(el.dataset.themeChoice));
    });
    document.querySelectorAll('[data-lang]').forEach(el => {
      el.addEventListener('click', () => App.I18n.setLanguage(el.dataset.lang));
    });
  }

  return { showApp, showLogin, navigateTo, refreshCurrentPage, syncThemeButtons, syncLangButtons, initShellEvents };
})();

/* ============================================================================
   SECTION 13: LOGIN PAGE CONTROLLER
   Purpose   : wires the login form to the Authentication Engine, including
               show/hide password, Enter-to-submit, and friendly error states.
   ============================================================================ */
App.LoginPage = (() => {
  function setLoading(isLoading){
    const btn = document.getElementById('login-submit');
    const label = document.getElementById('login-submit-label');
    btn.disabled = isLoading;
    if (isLoading){
      label.dataset.originalText = label.textContent;
      label.innerHTML = `<span class="spinner"></span>`;
    } else if (label.dataset.originalText){
      label.textContent = label.dataset.originalText;
    }
  }

  async function handleSubmit(e){
    e.preventDefault();
    const roleId = document.getElementById('login-role').value;
    const password = document.getElementById('login-password').value;
    const remember = document.getElementById('login-remember').checked;
    const errorEl = document.getElementById('login-error');
    const passwordInput = document.getElementById('login-password');
    errorEl.textContent = '';
    passwordInput.classList.remove('has-error');

    if (!password){
      errorEl.textContent = App.I18n.t('login.errorEmpty');
      passwordInput.classList.add('has-error');
      return;
    }

    setLoading(true);
    const result = await App.Auth.login(roleId, password, remember);
    setLoading(false);

    if (!result.ok){
      errorEl.textContent = App.I18n.t('login.errorInvalid');
      passwordInput.classList.add('has-error');
      passwordInput.focus();
      App.Notify.show('error', App.I18n.t('notify.loginFailedTitle'), '');
      return;
    }
    App.Notify.show('success', App.I18n.t('notify.loginSuccessTitle'), App.I18n.t('notify.loginSuccessMsg', { role: App.I18n.t(result.role.labelKey) }));
    App.Shell.showApp();
  }

  function initTogglePassword(){
    const toggle = document.getElementById('login-password-toggle');
    const input = document.getElementById('login-password');
    const icon = document.getElementById('login-password-icon');
    toggle.addEventListener('click', () => {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      icon.innerHTML = show
        ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.7 21.7 0 0 1-3.22 4.32M1 1l22 22"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/>'
        : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
      toggle.setAttribute('aria-label', App.I18n.t(show ? 'login.hidePassword' : 'login.showPassword'));
    });
  }

  function init(){
    document.getElementById('login-form').addEventListener('submit', handleSubmit);
    initTogglePassword();
    document.querySelectorAll('#login-lang-group [data-lang]').forEach(el => {
      el.addEventListener('click', () => App.I18n.setLanguage(el.dataset.lang, { silent:true }));
    });
    document.querySelectorAll('#login-theme-group [data-theme-choice]').forEach(el => {
      el.addEventListener('click', () => App.Theme.apply(el.dataset.themeChoice, { silent:true }));
    });
    document.getElementById('login-version').textContent = `v${App.Config.VERSION} · ${App.Config.BUILD_PHASE}`;
  }

  function syncButtons(){
    document.querySelectorAll('#login-lang-group [data-lang]').forEach(el => el.classList.toggle('active', el.dataset.lang === App.I18n.getLanguage()));
    document.querySelectorAll('#login-theme-group [data-theme-choice]').forEach(el => el.classList.toggle('active', el.dataset.themeChoice === App.State.get('theme')));
  }

  return { init, syncButtons };
})();

/* ============================================================================
   SECTION 14: INITIALIZATION
   Purpose   : boot sequence — theme/language first (so the login page never
               flashes unstyled), then attempt session restore, then reveal
               either the app shell or the login screen.
   ============================================================================ */
App.Init = (() => {
  const steps = [
    'Initializing configuration...',
    'Loading theme preferences...',
    'Loading language preferences...',
    'Checking session...',
    'Ready.'
  ];

  function setSplashStep(i){
    const stepEl = document.getElementById('splash-step');
    const barEl = document.getElementById('splash-bar-fill');
    if (stepEl) stepEl.textContent = steps[i];
    if (barEl) barEl.style.width = `${Math.round(((i+1)/steps.length)*100)}%`;
  }

  async function boot(){
    // Render icon placeholders (logo appears in three places in the DOM).
    document.querySelectorAll('.splash-logo, .login-logo').forEach(el => {
      el.innerHTML = App.Icons.svg('logo', 'icon icon-lg');
    });

    setSplashStep(0);
    const storedLang = App.LocalStore.get(App.Config.STORAGE_KEYS.LANGUAGE, App.Config.DEFAULT_LANGUAGE);

    setSplashStep(1);
    App.Theme.init();

    setSplashStep(2);
    App.I18n.setLanguage(storedLang, { persist:false, silent:true });

    setSplashStep(3);
    App.Shell.initShellEvents();
    App.LoginPage.init();
    App.LoginPage.syncButtons();
    const restored = App.Auth.restoreSession();

    setSplashStep(4);
    await new Promise(r => setTimeout(r, 250)); // brief, intentional — avoids a jarring flash

    document.getElementById('screen-splash').style.opacity = '0';
    setTimeout(() => { document.getElementById('screen-splash').style.display = 'none'; }, 260);

    if (restored) App.Shell.showApp();
    else App.Shell.showLogin();
  }

  return { boot };
})();

document.addEventListener('DOMContentLoaded', () => App.Init.boot());
</script>
